workflows:
  watch-build:
    name: Build Apple Watch IPA
    max_build_duration: 15
    instance_type: mac_mini_m2
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd watch_pc_controller
          xcodegen generate
      - name: Build Archive and Package IPA
        script: |
          cd watch_pc_controller
          xcodebuild -project PCVolumeWatch.xcodeproj \
            -scheme PCVolumeApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PCVolume.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive
          mkdir -p Payload
          cp -r build/PCVolume.xcarchive/Products/Applications/PCVolumeApp.app Payload/
          zip -r PCVolume.ipa Payload
          mkdir -p $CM_BUILD_DIR/output
          mv PCVolume.ipa $CM_BUILD_DIR/output/
    artifacts:
      - output/*.ipa
