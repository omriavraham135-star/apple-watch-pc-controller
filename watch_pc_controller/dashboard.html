<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Watch Minimalist Controller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #182234, #080c14);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .header-bar {
      text-align: center;
      margin-bottom: 28px;
    }
    .header-bar h1 {
      font-size: 20px;
      font-weight: 600;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }
    .ip-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 2px 10px;
      border-radius: 99px;
      font-family: monospace;
      font-size: 11px;
      margin-top: 6px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 40px;
      max-width: 860px;
      width: 100%;
    }

    /* Apple Watch Hardware Chassis */
    .watch-chassis {
      position: relative;
      width: 250px;
      height: 315px;
      background: #1c1c1e;
      border-radius: 56px;
      padding: 10px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 0 2px 2px #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }
    /* Digital Crown */
    .watch-crown {
      position: absolute;
      right: -10px;
      top: 65px;
      width: 10px;
      height: 48px;
      background: linear-gradient(to right, #2c2c2e, #48484a);
      border-radius: 4px;
      transition: transform 0.1s;
    }
    .crown-rotating {
      animation: crown-twist 0.15s ease-out;
    }
    @keyframes crown-twist {
      0% { transform: translateY(-2px); }
      50% { transform: translateY(2px); }
      100% { transform: translateY(0); }
    }
    .watch-chassis::after {
      content: '';
      position: absolute;
      right: -7px;
      top: 140px;
      width: 7px;
      height: 42px;
      background: #2c2c2e;
      border-radius: 3px;
    }

    /* Watch OLED Screen - Pure Minimalist Apple */
    .watch-screen {
      width: 100%;
      height: 100%;
      background: #000000;
      border-radius: 46px;
      overflow: hidden;
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      user-select: none;
    }

    /* Minimal Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }
    .vol-badge-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: #34d399;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 6px #34d399;
    }
    .vol-badge {
      color: #38bdf8;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 700;
      font-size: 13px;
    }

    /* Center Stage: The Orb */
    .orb-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      cursor: pointer;
      position: relative;
    }
    .orb-aura {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      filter: blur(22px);
      opacity: 0.65;
      transition: all 0.6s ease;
      background: radial-gradient(circle, #06b6d4, #8b5cf6, transparent 70%);
    }
    .orb-sphere {
      position: relative;
      width: 105px;
      height: 105px;
      border-radius: 50%;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.45), 0 0 24px rgba(6, 182, 212, 0.65);
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.92) 0%, rgba(56,189,248,0.75) 30%, rgba(139,92,246,0.85) 60%, rgba(15,23,42,0.95) 90%);
    }
    .orb-sphere:hover {
      transform: scale(1.04);
    }

    /* Waveform visualizer */
    .wave-bars {
      display: flex;
      align-items: center;
      gap: 3px;
      z-index: 2;
    }
    .wave-bar {
      width: 3px;
      background: white;
      border-radius: 99px;
      animation: bar-dance 0.8s ease-in-out infinite alternate;
    }
    @keyframes bar-dance {
      0% { height: 6px; opacity: 0.6; }
      100% { height: 26px; opacity: 1; }
    }

    /* State animations */
    .state-idle .orb-sphere {
      animation: orb-breathe 4s ease-in-out infinite;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.5) 0%, rgba(71,85,105,0.6) 30%, rgba(30,41,59,0.95) 80%);
      box-shadow: inset 0 0 15px rgba(255,255,255,0.2), 0 0 15px rgba(56, 189, 248, 0.3);
    }
    .state-idle .orb-aura {
      background: radial-gradient(circle, #38bdf8, #6366f1, transparent 70%);
      opacity: 0.35;
    }

    .state-listening .orb-sphere {
      animation: orb-listen 1.2s ease-in-out infinite;
      box-shadow: inset 0 0 25px rgba(255,255,255,0.7), 0 0 35px #06b6d4;
    }
    .state-listening .orb-aura {
      background: radial-gradient(circle, #06b6d4, #d946ef, transparent 70%);
      opacity: 0.85;
      transform: scale(1.15);
    }

    .state-thinking .orb-sphere {
      animation: orb-spin 2s linear infinite;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9) 0%, #d946ef 35%, #7e22ce 70%, #0f172a 95%);
      box-shadow: 0 0 40px #d946ef;
    }
    .state-thinking .orb-aura {
      background: radial-gradient(circle, #d946ef, #a855f7, transparent 70%);
      opacity: 0.9;
    }

    .state-success .orb-sphere {
      animation: orb-pop 0.6s ease-out;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95) 0%, #34d399 30%, #10b981 70%, #064e3b 95%);
      box-shadow: 0 0 45px #34d399;
    }
    .state-success .orb-aura {
      background: radial-gradient(circle, #34d399, #10b981, transparent 70%);
      opacity: 0.95;
    }

    @keyframes orb-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes orb-listen {
      0%, 100% { transform: scale(1.03); }
      50% { transform: scale(1.15); }
    }
    @keyframes orb-spin {
      0% { transform: rotate(0deg) scale(1.05); }
      100% { transform: rotate(360deg) scale(1.05); }
    }
    @keyframes orb-pop {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1.04); }
    }

    /* Apple Minimalist Capsule Slider */
    .slider-wrapper {
      width: 100%;
    }
    .apple-slider-track {
      position: relative;
      width: 100%;
      height: 36px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 99px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .apple-slider-track:hover {
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.25), inset 0 1px 3px rgba(0,0,0,0.4);
    }

    .apple-slider-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: {{VOL}}%;
      background: linear-gradient(90deg, #0284c7 0%, #38bdf8 70%, #818cf8 100%);
      border-radius: 99px;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
      transition: width 0.08s ease-out;
      pointer-events: none;
    }

    .slider-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 3;
      pointer-events: none;
    }
    .slider-icon {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    }
    .slider-pct {
      font-size: 12px;
      font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      letter-spacing: 0.3px;
    }

    /* Side Control Panel */
    .controls-panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }
    .controls-panel h2 {
      font-size: 15px;
      color: #38bdf8;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .test-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .cmd-btn {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-align: right;
    }
    .cmd-btn:hover {
      border-color: #38bdf8;
      background: #1e293b;
      color: #38bdf8;
    }
    .custom-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .custom-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      color: white;
      font-size: 13px;
      outline: none;
      text-align: right;
    }
    .custom-input:focus {
      border-color: #38bdf8;
    }
    .send-btn {
      background: #0284c7;
      border: none;
      color: white;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }
    .send-btn:hover {
      background: #0369a1;
    }

    .log-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      font-family: monospace;
      color: #34d399;
      min-height: 42px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>Apple Watch Minimalist</h1>
    <div class="ip-badge">{{CURRENT_IP}}:8000</div>
  </div>

  <div class="container">
    
    <!-- Apple Watch Frame Simulator (Zero Text Clutter) -->
    <div class="watch-chassis" id="watchChassis">
      <div class="watch-crown" id="watchCrown"></div>
      
      <div class="watch-screen state-idle" id="watchScreen">
        
        <!-- Clean Top Bar -->
        <div class="top-bar">
          <span id="watchTime">14:57</span>
          <div class="vol-badge-group">
            <span class="status-dot"></span>
            <span class="vol-badge" id="screenVol">{{VOL}}%</span>
          </div>
        </div>

        <!-- The Pure Glowing Orb -->
        <div class="orb-stage" onclick="triggerMic()">
          <div class="orb-aura" id="orbAura"></div>
          <div class="orb-sphere" id="orbSphere">
            <div class="wave-bars" id="waveBars" style="display: none;">
              <span class="wave-bar" style="animation-delay: 0s;"></span>
              <span class="wave-bar" style="animation-delay: 0.2s;"></span>
              <span class="wave-bar" style="animation-delay: 0.4s;"></span>
              <span class="wave-bar" style="animation-delay: 0.1s;"></span>
              <span class="wave-bar" style="animation-delay: 0.3s;"></span>
            </div>
          </div>
        </div>

        <!-- Clean Capsule Slider -->
        <div class="slider-wrapper">
          <div class="apple-slider-track" id="sliderTrack">
            <div class="apple-slider-fill" id="sliderFill"></div>
            <div class="slider-content">
              <span class="slider-icon">🔈</span>
              <span class="slider-pct" id="sliderPctText">{{VOL}}%</span>
              <span class="slider-icon">🔊</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Side Control Panel -->
    <div class="controls-panel">
      <h2>🎛️ פקודות בדיקה מהירות</h2>

      <div class="test-grid">
        <button class="cmd-btn" onclick="executeCmd('תנמיך ב-50 אחוז')">📉 תנמיך ב-50%</button>
        <button class="cmd-btn" onclick="executeCmd('תנמיך ל-50 אחוז')">🎯 תנמיך ל-50%</button>
        <button class="cmd-btn" onclick="executeCmd('תגביר ב-20 אחוז')">📈 תגביר ב-20%</button>
        <button class="cmd-btn" onclick="executeCmd('תגביר ל-80 אחוז')">🎯 תגביר ל-80%</button>
        <button class="cmd-btn" onclick="executeCmd('עד הסוף')">🔊 100%</button>
        <button class="cmd-btn" onclick="executeCmd('תשתיק')">🔇 השתק</button>
      </div>

      <div class="custom-box">
        <input type="text" id="customInput" class="custom-input" placeholder="פקודה בעברית..." onkeydown="if(event.key==='Enter') sendCustom()">
        <button class="send-btn" onclick="sendCustom()">שלח</button>
      </div>

      <div class="log-box" id="logBox">מוכן.</div>
    </div>

  </div>

  <script>
    let currentVol = parseInt("{{VOL}}") || 50;
    let isDragging = false;
    let debounceTimer = null;

    function updateTime() {
      const d = new Date();
      document.getElementById('watchTime').textContent = 
        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    updateTime();
    setInterval(updateTime, 10000);

    function updateVolumeDisplay(vol) {
      currentVol = Math.max(0, Math.min(100, Math.round(vol)));
      document.getElementById('sliderFill').style.width = currentVol + '%';
      document.getElementById('sliderPctText').textContent = currentVol + '%';
      document.getElementById('screenVol').textContent = currentVol + '%';
    }

    function syncVolumeToPC(target) {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch('/api/volume', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ volume: target })
          });
          const data = await res.json();
          document.getElementById('logBox').innerText = 'PC: ' + data.volume + '%';
        } catch (e) {
          console.error(e);
        }
      }, 40);
    }

    // Slider Drag Logic
    const track = document.getElementById('sliderTrack');
    function handleSliderMove(e) {
      const rect = track.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const pct = (clientX - rect.left) / rect.width;
      const target = Math.max(0, Math.min(100, Math.round(pct * 100)));
      updateVolumeDisplay(target);
      syncVolumeToPC(target);
    }

    track.addEventListener('mousedown', (e) => {
      isDragging = true;
      handleSliderMove(e);
    });
    window.addEventListener('mousemove', (e) => {
      if (isDragging) handleSliderMove(e);
    });
    window.addEventListener('mouseup', () => {
      if (isDragging) isDragging = false;
    });

    track.addEventListener('touchstart', (e) => {
      isDragging = true;
      handleSliderMove(e);
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (isDragging) handleSliderMove(e);
    }, { passive: true });
    window.addEventListener('touchend', () => {
      isDragging = false;
    });

    // Digital Crown Wheel
    const watchChassis = document.getElementById('watchChassis');
    const watchCrown = document.getElementById('watchCrown');

    watchChassis.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 2 : -2;
      const nextVol = Math.max(0, Math.min(100, currentVol + delta));
      
      watchCrown.classList.remove('crown-rotating');
      void watchCrown.offsetWidth;
      watchCrown.classList.add('crown-rotating');

      updateVolumeDisplay(nextVol);
      syncVolumeToPC(nextVol);
    }, { passive: false });

    // State Transitions
    function setWatchState(stateName) {
      const screen = document.getElementById('watchScreen');
      screen.className = 'watch-screen state-' + stateName;
      const waves = document.getElementById('waveBars');
      waves.style.display = (stateName === 'listening' || stateName === 'executing') ? 'flex' : 'none';
    }

    async function executeCmd(text) {
      setWatchState('thinking');
      document.getElementById('logBox').innerText = 'מבצע: "' + text + '"...';

      try {
        const res = await fetch('/api/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        
        if (data.status === 'success') {
          setWatchState('success');
          document.getElementById('logBox').innerText = '✓ ' + data.feedback;
          
          if (data.details && data.details.new_volume !== undefined) {
            updateVolumeDisplay(data.details.new_volume);
          }

          setTimeout(() => {
            setWatchState('idle');
          }, 1800);

        } else {
          setWatchState('idle');
          document.getElementById('logBox').innerText = '⚠ ' + data.feedback;
        }
      } catch (err) {
        setWatchState('idle');
        document.getElementById('logBox').innerText = 'שגיאה: ' + err.message;
      }
    }

    function sendCustom() {
      const val = document.getElementById('customInput').value.trim();
      if (val) {
        executeCmd(val);
        document.getElementById('customInput').value = '';
      }
    }

    function triggerMic() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRec();
        recognition.lang = 'he-IL';
        setWatchState('listening');
        
        recognition.onresult = function(event) {
          const text = event.results[0][0].transcript;
          document.getElementById('logBox').innerText = 'שמעתי: "' + text + '"';
          executeCmd(text);
        };
        recognition.onerror = function() {
          setWatchState('idle');
        };
        recognition.start();
      } else {
        const text = prompt('דבר אל השעון:', 'תנמיך ב-50 אחוז');
        if (text) executeCmd(text);
      }
    }
  </script>
</body>
</html>
