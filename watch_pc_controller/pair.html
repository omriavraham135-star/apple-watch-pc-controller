<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>צימוד מכשיר</title>
<style>
  :root { --ink: #f5f5f7; --dim: rgba(245,245,247,.6); --faint: rgba(245,245,247,.35); --acc: 226,150,120; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--ink);
    font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(900px 600px at 70% 10%, #141a33, transparent 60%), #07080d;
  }
  main { width: min(360px, 92vw); display: grid; gap: 14px; text-align: center; }
  h1 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: .3px; }
  p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.6; }
  .code { font-size: 44px; font-weight: 300; letter-spacing: 12px; direction: ltr; padding: 10px 0; }
  .count { color: var(--faint); font-size: 12px; }
  input {
    width: 100%; font: inherit; font-size: 28px; letter-spacing: 10px; text-align: center; direction: ltr; color: var(--ink);
    padding: 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); outline: none;
  }
  input.name { font-size: 15px; letter-spacing: 0; }
  button {
    font: inherit; font-size: 15px; font-weight: 500; color: var(--ink); cursor: pointer; padding: 12px; border-radius: 16px;
    border: 1px solid rgba(var(--acc),.45); background: rgba(var(--acc),.12);
  }
  .err { color: #E48B82; font-size: 13px; min-height: 18px; }
  ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; text-align: start; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.05); font-size: 14px; }
  li button { padding: 6px 12px; font-size: 12px; border-color: rgba(228,139,130,.45); background: rgba(228,139,130,.1); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="pc" hidden>
    <h1>צימוד מכשיר חדש</h1>
    <p>צור קוד והקלד אותו במכשיר שאתה רוצה לחבר. הקוד תקף לשתי דקות ומצמד מכשיר אחד.</p>
    <div class="code" id="code">······</div>
    <div class="count" id="count"></div>
    <button id="mint">צור קוד</button>
    <p>מכשירים מצומדים</p>
    <ul id="devices"></ul>
  </section>

  <section id="device" hidden>
    <h1>צימוד למחשב</h1>
    <p>פתח את <b>/pair</b> במחשב, לחץ "צור קוד", והקלד אותו כאן.</p>
    <input id="digits" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
    <input id="name" class="name" maxlength="40" value="Apple Watch" aria-label="שם המכשיר">
    <button id="pairBtn">צמד</button>
    <div class="err" id="err"></div>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // On the PC itself the device list answers; anywhere else it is refused.
  fetch('/api/devices').then((res) => (res.ok ? res.json().then(showPc) : showDevice())).catch(showDevice);

  function showPc(data) {
    document.body.dataset.mode = 'pc';
    $('pc').hidden = false;
    renderDevices(data.devices || []);
    let timer = null;
    $('mint').onclick = () => fetch('/api/pair/code', { method: 'POST' }).then((r) => r.json()).then((d) => {
      $('code').textContent = d.code;
      let left = d.expires_in;
      clearInterval(timer);
      const tick = () => {
        $('count').textContent = left > 0 ? `תקף עוד ${left} שניות` : 'פג תוקף. צור קוד חדש.';
        if (left <= 0) { clearInterval(timer); $('code').textContent = '······'; }
        left -= 1;
      };
      tick();
      timer = setInterval(tick, 1000);
      // pick up the new device as soon as it pairs
      const watch = setInterval(() => fetch('/api/devices').then((r) => r.json()).then((x) => renderDevices(x.devices || [])), 2000);
      setTimeout(() => clearInterval(watch), d.expires_in * 1000);
    });
  }

  function renderDevices(list) {
    $('devices').innerHTML = list.length ? '' : '<li>אין עדיין מכשירים מצומדים</li>';
    for (const dev of list) {
      const li = document.createElement('li');
      li.innerHTML = `<span></span><button>נתק</button>`;
      li.querySelector('span').textContent = dev.name;
      li.querySelector('button').onclick = () =>
        fetch('/api/devices/' + encodeURIComponent(dev.id), { method: 'DELETE' })
          .then(() => fetch('/api/devices')).then((r) => r.json()).then((x) => renderDevices(x.devices || []));
      $('devices').appendChild(li);
    }
  }

  function showDevice() {
    document.body.dataset.mode = 'device';
    $('device').hidden = false;
    $('digits').focus();
    $('pairBtn').onclick = () => {
      $('err').textContent = '';
      fetch('/api/pair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: $('digits').value.trim(), device_name: $('name').value.trim() }),
      }).then((res) => res.json().then((d) => ({ ok: res.ok, d }))).then(({ ok, d }) => {
        if (!ok) { $('err').textContent = d.detail || 'הצימוד נכשל'; return; }
        try { localStorage.setItem('pcToken', d.token); } catch (e) { $('err').textContent = 'הדפדפן חוסם שמירה. נסה שלא במצב פרטי.'; return; }
        location.href = '/';
      }).catch(() => { $('err').textContent = 'אין חיבור למחשב'; });
    };
  }
})();
</script>
</body>
</html>
