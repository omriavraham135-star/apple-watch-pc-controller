name: PCVolumeWatch

options:
  # A free Apple ID can only sign bundle identifiers that no other developer has
  # registered, so this must be distinctive; a generic prefix risks a collision.
  bundleIdPrefix: com.omriavraham
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"

targets:

  # The iOS app exists because watchOS requires a host. It carries the watch
  # app and shows a single explanatory screen.
  PCVolumeApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ios_app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omriavraham.pcvolume
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "PC Control"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      # `embed: true` alone. Adding an explicit copy phase on top of it made
      # two build commands produce the same binary, which Xcode refuses. Where
      # the watch app lands is the generator's business; CI reports it.
      - target: PCVolumeWatchApp
        embed: true

  PCVolumeWatchApp:
    # A modern single-target watchOS app is a plain application. The legacy
    # `application.watchapp2` type makes Xcode copy in a prebuilt WatchKit stub
    # binary, which collides with the one this target compiles:
    # "Multiple commands produce .../PCVolumeWatchApp".
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: apple_watch_app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omriavraham.pcvolume.watchkitapp
        WKCompanionAppBundleIdentifier: com.omriavraham.pcvolume
    info:
      path: apple_watch_app/Info.plist
      properties:
        CFBundleDisplayName: "PC Control"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.omriavraham.pcvolume
        WKWatchOnly: false
        NSMicrophoneUsageDescription: "שליטה קולית בווליום של המחשב"
        NSSpeechRecognitionUsageDescription: "זיהוי פקודות דיבור בעברית"
        # The PC is reached over plain HTTP on the local network. Without this
        # exception App Transport Security blocks the request and the app
        # simply never connects.
        NSLocalNetworkUsageDescription: "חיבור למחשב שלך ברשת הביתית"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

schemes:
  # The watch app alone, so it can be built for the simulator and run there
  # without dragging the iOS host along.
  PCVolumeWatchApp:
    build:
      targets:
        PCVolumeWatchApp: all
    run:
      config: Debug
